name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck -x *.sh .github/scripts/*.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            # TODO: switch to ubuntu-26.04-arm once it is out of public preview
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Build Flutter snap
        uses: snapcore/action-build@v1
        id: snapcraft
      - name: Upload Flutter snap
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}

  test:
    needs: build
    uses: ./.github/workflows/test.yaml
    with:
      snap: artifact

  cleanup:
    needs: [build, test]
    # Only clean up when the tests passed, so the snaps are kept for
    # inspection or re-runs when a test fails.
    if: ${{ success() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete Flutter snap
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            snap-amd64
            snap-arm64
